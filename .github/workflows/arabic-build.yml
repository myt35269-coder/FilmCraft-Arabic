name: Arabic localization build

on:
  workflow_dispatch:
  push:
    paths:
      - 'crates/ui-egui/src/i18n/ar.tsv'
      - 'patches/**'
      - '.github/workflows/arabic-build.yml'
      - 'PATCH-0.20.1.md'

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout localization project
        uses: actions/checkout@v4
      - name: Checkout pinned FilmCraft source
        uses: actions/checkout@v4
        with:
          repository: storytold/filmcraft
          ref: cedf0c9bd060eb06a977d532402be2097c9ebe42
          path: filmcraft
      - name: Apply Arabic integration
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path filmcraft/patches | Out-Null
          Copy-Item crates/ui-egui/src/i18n/ar.tsv filmcraft/crates/ui-egui/src/i18n/ar.tsv -Force
          Copy-Item patches/apply-arabic-localization.py filmcraft/patches/apply-arabic-localization.py -Force
          python filmcraft/patches/apply-arabic-localization.py
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - name: Report untranslated Arabic interface strings
        working-directory: filmcraft
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ../dist | Out-Null
          cargo xtask i18n-report 2>&1 | Tee-Object -FilePath ../dist/arabic-translation-report.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rust formatting
        working-directory: filmcraft
        run: cargo fmt --all -- --check
      - name: Arabic localization tests
        working-directory: filmcraft
        run: cargo test --locked -p filmcraft-ui-egui --lib
      - name: Workspace compile check
        working-directory: filmcraft
        run: cargo check --locked --workspace
      - name: Build Windows preview
        working-directory: filmcraft
        run: cargo build --locked --release -p filmcraft
      - name: Package portable preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/FilmCraft-Arabic | Out-Null
          Copy-Item filmcraft/target/release/filmcraft.exe dist/FilmCraft-Arabic/FilmCraft-Arabic.exe
          @'
          FilmCraft Arabic Preview (Windows x64)

          This is an isolated preview build of FilmCraft 0.20.1 with the Arabic interface catalog.
          It does not replace or modify an existing FilmCraft installation.
          Extract the ZIP and run FilmCraft-Arabic.exe.
          This preview is not digitally signed and has not yet received full manual RTL/UI testing on Windows.
          '@ | Set-Content -Encoding utf8 dist/FilmCraft-Arabic/README.txt
          Compress-Archive -Path dist/FilmCraft-Arabic/* -DestinationPath dist/FilmCraft-Arabic-Windows-x64-preview.zip -Force
      - name: Upload Windows preview and translation report
        uses: actions/upload-artifact@v4
        with:
          name: FilmCraft-Arabic-Windows-x64-preview
          path: |
            dist/FilmCraft-Arabic-Windows-x64-preview.zip
            dist/arabic-translation-report.txt
          if-no-files-found: error
          retention-days: 14
